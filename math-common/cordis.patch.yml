# Shared math contracts for the primary math bands.
#
# Roots are resolved from the installed package location (baseUrl = the profile
# dir), so link:, file: and git installs all behave the same. Registry publish
# ships without "private": true.
- insert:
    - id: edu-math-common-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: edu-math-common
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-edu-math/package.json')), 'skills')
