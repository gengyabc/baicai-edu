# Task-driven, multi-method math teaching skills for grades 4-6; board optional.
# One provider implementation, one loader row per selected bundle. This row
# owns only this bundle's skills, so DSH can remove them when it is disabled.
- insert:
    - id: edu-skills-math-primary-high
      name: baicai-edu-learn/skill-provider.mjs
      config:
        packages:
          - !!js (() => { const resolve = process.getBuiltinModule('node:module').createRequire(baseUrl + 'x').resolve; try { return resolve('baicai-edu-math-primary-high/package.json') } catch { return 'baicai-edu-math-primary-high/package.json' } })()
