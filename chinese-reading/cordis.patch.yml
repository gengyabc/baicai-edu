# Chinese language teaching skills for baicai-edu.
# One provider implementation, one loader row per selected bundle. This row
# owns only this bundle's skills, so DSH can remove them when it is disabled.
- insert:
    - id: edu-skills-chinese-reading
      name: baicai-edu-learn/skill-provider.mjs
      config:
        packages:
          - !!js (() => { const resolve = process.getBuiltinModule('node:module').createRequire(baseUrl + 'x').resolve; try { return resolve('baicai-edu-chinese-reading/package.json') } catch { return 'baicai-edu-chinese-reading/package.json' } })()
