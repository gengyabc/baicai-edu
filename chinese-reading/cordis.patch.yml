# Chinese language teaching skills for dsh-edu.
#
# Roots are resolved from the installed package location (baseUrl = the profile
# dir), so link:, file: and git installs all behave the same. Registry publish
# additionally requires removing "private": true from package.json.
- insert:
    - id: edu-chinese-reading-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: edu-chinese-reading
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-edu-chinese-reading/package.json')), 'skills')
