# CGI-style primary math teaching skills for dsh-edu, focused on grades 1-3.
#
# Roots are resolved from the installed package location (baseUrl = the profile
# dir), so link:, file: and git installs all behave the same. Registry publish
# ships without "private": true.
- insert:
    - id: edu-math-primary-low-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: edu-math-primary-low
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-edu-math-primary-low/package.json')), 'skills')
