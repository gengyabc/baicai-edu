# CGI-style primary math teaching skills for baicai-edu, focused on grades 1-3.
# One provider implementation, one loader row per selected bundle. This row
# owns only this bundle's skills, so DSH can remove them when it is disabled.
- insert:
    - id: edu-skills-math-primary-low
      name: baicai-edu-learn/skill-provider.mjs
      config:
        packages:
          - !!js (() => { const resolve = process.getBuiltinModule('node:module').createRequire(baseUrl + 'x').resolve; try { return resolve('baicai-edu-math-primary-low/package.json') } catch { return 'baicai-edu-math-primary-low/package.json' } })()
